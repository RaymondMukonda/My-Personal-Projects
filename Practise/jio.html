<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!DOCTYPE html>
<html>
<head>
  <title>innerHTML vs innerText</title>
  <script>
    function useInnerHTML() {
      document.getElementById("demo").innerHTML = "Hello <b>World</b>";
    }

    function useInnerText() {
      document.getElementById("demo").innerText = "Hello <b>World</b>";
    }
  </script>
</head>
<body>
  <p id="demo">Original Text</p>

  <button onclick="useInnerHTML()">Change with innerHTML</button>
  <button onclick="useInnerText()">Change with innerText</button>
</body>
</html>

</body>
</html>
