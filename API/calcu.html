<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calcu.css">
</head>
<body>

    <div class="calShape">

        <input class="input-feild">

        <div class="row">
            <button>C</button>
            <button>()</button>
            <button>%</button>
            <button>➗</button>
        </div>

        <div class="row">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>×</button>
        </div>

        <div class="row">
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>
        </div>

        <div class="row">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>
        </div>

        <div class="row">
            <button>+/-</button>
            <button>0</button>
            <button>.</button>
            <button>=</button>
        </div>

    </div>

</body>
</html>
